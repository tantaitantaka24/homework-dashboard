<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard การส่งงาน — คณิตศาสตร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --text2: #8b90a7;
    --text3: #555a72;
    --blue: #4f8ef7;
    --blue-dim: rgba(79,142,247,0.15);
    --green: #34c78a;
    --green-dim: rgba(52,199,138,0.15);
    --red: #f25c7a;
    --red-dim: rgba(242,92,122,0.15);
    --amber: #f5a623;
    --amber-dim: rgba(245,166,35,0.15);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-refresh {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text2);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh:hover { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }

  .last-update {
    font-size: 12px;
    color: var(--text3);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 16px 24px 0;
  }
  .tab {
    padding: 8px 20px;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.15s;
    background: transparent;
    color: var(--text3);
    font-family: 'Sarabun', sans-serif;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border2);
  }
  .tab:hover:not(.active) { color: var(--text2); }

  /* MAIN */
  .main {
    padding: 0 24px 40px;
  }
  .panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    padding: 24px;
    animation: fadeIn 0.2s ease;
  }
  .panel.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* STATS GRID */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.blue::before { background: var(--blue); }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before { background: var(--red); }
  .stat-card.amber::before { background: var(--amber); }
  .stat-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .stat-card.blue .stat-value { color: var(--blue); }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.red .stat-value { color: var(--red); }
  .stat-card.amber .stat-value { color: var(--amber); }
  .stat-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* GRID 2 COL */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media(max-width:640px) { .grid2 { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  /* STUDENT TABLE */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Sarabun', sans-serif;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
  .filter-btn:hover:not(.active) { border-color: var(--text3); color: var(--text); }

  .student-table { width: 100%; border-collapse: collapse; }
  .student-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .student-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }
  .student-table tr:last-child td { border-bottom: none; }
  .student-table tr { transition: background 0.1s; cursor: pointer; }
  .student-table tr:hover td { background: var(--surface2); }

  .progress-bar {
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    width: 100%;
    min-width: 80px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-red { background: var(--red-dim); color: var(--red); }
  .badge-green { background: var(--green-dim); color: var(--green); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); }

  /* MODAL / DRILL-DOWN */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  .modal-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .modal-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .modal-meta { font-size: 13px; color: var(--text2); }
  .modal-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--text); border-color: var(--text3); }
  .modal-body { padding: 20px; }

  .missing-section { margin-bottom: 20px; }
  .missing-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .missing-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .missing-dot.red { background: var(--red); }
  .missing-dot.amber { background: var(--amber); }

  .missing-list { display: flex; flex-direction: column; gap: 4px; }
  .missing-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13px;
    color: var(--text2);
    border-left: 3px solid transparent;
  }
  .missing-item.nb { border-left-color: var(--amber); }
  .missing-item.ex { border-left-color: var(--red); }

  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .modal-stat {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    text-align: center;
  }
  .modal-stat-val { font-size: 20px; font-weight: 600; }
  .modal-stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* LOADING */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 60px;
    color: var(--text3);
    font-size: 14px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border2);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: var(--red-dim);
    border: 1px solid var(--red);
    border-radius: var(--radius-sm);
    padding: 16px;
    color: var(--red);
    font-size: 14px;
    margin-bottom: 16px;
  }

  /* COMPARISON BARS */
  .compare-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .compare-label { width: 40px; color: var(--text2); font-weight: 500; flex-shrink: 0; }
  .compare-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 10px; overflow: hidden; }
  .compare-bar-fill { height: 100%; border-radius: 4px; }
  .compare-pct { width: 36px; text-align: right; color: var(--text2); font-family: 'IBM Plex Mono', monospace; font-size: 12px; flex-shrink: 0; }

  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text3);
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <div class="header-dot"></div>
    Dashboard การส่งงาน — คณิตศาสตร์
  </div>
  <div class="header-right">
    <span class="last-update" id="lastUpdate">กำลังโหลด...</span>
    <button class="btn-refresh" onclick="loadData()">↺ รีเฟรช</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('overview')">ภาพรวม</button>
  <button class="tab" onclick="switchTab('p4')">ป.4</button>
  <button class="tab" onclick="switchTab('p6')">ป.6</button>
</div>

<div class="main">

  <!-- OVERVIEW PANEL -->
  <div class="panel active" id="panel-overview">
    <div id="overview-content">
      <div class="loading"><div class="spinner"></div>กำลังดึงข้อมูลจาก Google Sheets...</div>
    </div>
  </div>

  <!-- P4 PANEL -->
  <div class="panel" id="panel-p4">
    <div id="p4-content">
      <div class="loading"><div class="spinner"></div>กำลังโหลด...</div>
    </div>
  </div>

  <!-- P6 PANEL -->
  <div class="panel" id="panel-p6">
    <div id="p6-content">
      <div class="loading"><div class="spinner"></div>กำลังโหลด...</div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SHEET_ID = '1B_10xc1K2HYEHACRxxc9OoKoW5kmfQe0aMYKBES15Q8';
// Sheet GIDs — ดูจาก URL ของแต่ละ tab ใน Google Sheets
// คณิตศาสตร์ ป.4 และ ป.6 — ใช้ CSV export ซึ่งทำงานได้จาก file:// โดยไม่ติด CORS
const GID_P4 = '21024681';   // gid ของ Sheet คณิตศาสตร์ ป.4
const GID_P6 = '1784260155'; // gid ของ Sheet คณิตศาสตร์ ป.6

let data = { p4: null, p6: null };
let charts = {};
let currentFilter = { p4: 'all', p6: 'all' };

// ── FETCH via CSV export ────────────────────────────────────
async function fetchCSV(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.split('\n');
  return lines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = 'กำลังโหลด...';
  ['overview','p4','p6'].forEach(k => {
    const el = document.getElementById(`${k}-content`);
    if (el) el.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังดึงข้อมูลจาก Google Sheets...</div>';
  });
  try {
    const [rows4, rows6] = await Promise.all([
      fetchCSV(GID_P4),
      fetchCSV(GID_P6),
    ]);

    data.p4 = parseClassSheet(rows4);
    data.p6 = parseClassSheet(rows6);

    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `อัปเดต ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} น.`;

    renderAll();
  } catch(e) {
    const msg = `<div class="error-msg">⚠ ดึงข้อมูลไม่ได้: ${e.message}<br>
      <small>วิธีแก้: Upload ไฟล์ HTML นี้ขึ้น Google Drive → คลิกขวา → Open with Chrome (ไม่ใช่เปิดจาก Downloads โดยตรง)</small></div>`;
    document.getElementById('overview-content').innerHTML = msg;
    document.getElementById('lastUpdate').textContent = 'โหลดไม่สำเร็จ';
  }
}

// ── PARSE ──────────────────────────────────────────────────
function parseClassSheet(rows) {
  // rows[0] = group header, rows[1] = col labels (น1..นN, ฝ1..ฝN, จำนวน, ขาดส่ง)
  // rows[2] = task names (row3 in sheet)
  // rows[3+] = student data
  if (rows.length < 4) return { students: [], taskNames: [], nbCount: 0, exCount: 0 };

  const headerRow = rows[1] || [];
  const taskRow   = rows[2] || [];

  // find nb cols (น1..) and ex cols (ฝ1..)
  let nbStart = -1, nbEnd = -1, exStart = -1, exEnd = -1;
  for (let i = 0; i < headerRow.length; i++) {
    const v = headerRow[i];
    if (v.startsWith('น') && nbStart === -1) nbStart = i;
    if (v.startsWith('น')) nbEnd = i;
    if (v.startsWith('ฝ') && exStart === -1) exStart = i;
    if (v.startsWith('ฝ')) exEnd = i;
  }

  const nbCount = nbEnd - nbStart + 1;
  const exCount = exEnd - exStart + 1;

  const taskNames = [];
  for (let i = nbStart; i <= exEnd; i++) {
    taskNames.push(taskRow[i] || headerRow[i] || `งาน ${i - nbStart + 1}`);
  }

  const students = [];
  for (let r = 3; r < rows.length; r++) {
    const row = rows[r];
    if (!row[0] || !row[1]) continue;
    const name = row[1].replace(/^ด\.[ชญ]\./, '').trim();
    const fullName = row[1].trim();

    const submitted = [];
    const missing = [];
    for (let i = nbStart; i <= exEnd; i++) {
      const val = row[i] || '';
      const taskName = taskNames[i - nbStart];
      const isNb = i <= nbEnd;
      if (val === 'ส่ง') {
        submitted.push({ name: taskName, type: isNb ? 'nb' : 'ex', col: i });
      } else {
        missing.push({ name: taskName, type: isNb ? 'nb' : 'ex', col: i });
      }
    }

    students.push({
      num: parseInt(row[0]) || r - 2,
      name, fullName,
      submitted: submitted.length,
      missing: missing.length,
      total: nbCount + exCount,
      missingList: missing,
      submittedList: submitted,
      nbSubmitted: submitted.filter(x => x.type === 'nb').length,
      exSubmitted: submitted.filter(x => x.type === 'ex').length,
      nbMissing: missing.filter(x => x.type === 'nb').length,
      exMissing: missing.filter(x => x.type === 'ex').length,
    });
  }

  return { students, taskNames, nbCount, exCount, nbStart, exStart };
}

// ── RENDER ─────────────────────────────────────────────────
function renderAll() {
  renderOverview();
  renderClass('p4', data.p4, 'ป.4');
  renderClass('p6', data.p6, 'ป.6');
}

function calcStats(d) {
  if (!d || !d.students.length) return null;
  const s = d.students;
  const total = d.nbCount + d.exCount;
  const totalSlots = s.length * total;
  const totalSubmitted = s.reduce((a, x) => a + x.submitted, 0);
  const rate = totalSlots ? Math.round(totalSubmitted / totalSlots * 100) : 0;
  const fullySubmitted = s.filter(x => x.missing === 0).length;
  const hasMissing = s.filter(x => x.missing > 0).length;
  return { total, totalSlots, totalSubmitted, rate, fullySubmitted, hasMissing, count: s.length };
}

function renderOverview() {
  const s4 = calcStats(data.p4);
  const s6 = calcStats(data.p6);
  if (!s4 || !s6) return;

  const allStudents = s4.count + s6.count;
  const allMissing = s4.hasMissing + s6.hasMissing;
  const avgRate = Math.round((s4.rate + s6.rate) / 2);

  const html = `
    <div class="stats">
      <div class="stat-card blue">
        <div class="stat-label">นักเรียนทั้งหมด</div>
        <div class="stat-value">${allStudents}</div>
        <div class="stat-sub">ป.4: ${s4.count} / ป.6: ${s6.count}</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">อัตราส่งงานเฉลี่ย</div>
        <div class="stat-value">${avgRate}%</div>
        <div class="stat-sub">ป.4: ${s4.rate}% / ป.6: ${s6.rate}%</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">มีงานค้าง</div>
        <div class="stat-value">${allMissing}</div>
        <div class="stat-sub">คน</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">ส่งครบทุกชิ้น</div>
        <div class="stat-value">${s4.fullySubmitted + s6.fullySubmitted}</div>
        <div class="stat-sub">คน</div>
      </div>
    </div>

    <div class="grid2">
      <div class="chart-card">
        <div class="chart-title">อัตราส่งงาน — เปรียบเทียบ</div>
        <div class="compare-row">
          <span class="compare-label">ป.4</span>
          <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${s4.rate}%;background:var(--blue)"></div></div>
          <span class="compare-pct">${s4.rate}%</span>
        </div>
        <div class="compare-row">
          <span class="compare-label">ป.6</span>
          <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${s6.rate}%;background:var(--green)"></div></div>
          <span class="compare-pct">${s6.rate}%</span>
        </div>
        <div style="margin-top:20px">
          <div class="compare-row">
            <span class="compare-label" style="width:60px;font-size:12px">หนังสือ ป.4</span>
            <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${data.p4.nbCount ? Math.round(data.p4.students.reduce((a,x)=>a+x.nbSubmitted,0)/data.p4.students.length/data.p4.nbCount*100) : 0}%;background:var(--amber)"></div></div>
            <span class="compare-pct">${data.p4.nbCount ? Math.round(data.p4.students.reduce((a,x)=>a+x.nbSubmitted,0)/data.p4.students.length/data.p4.nbCount*100) : 0}%</span>
          </div>
          <div class="compare-row">
            <span class="compare-label" style="width:60px;font-size:12px">แบบฝึกฯ ป.4</span>
            <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${data.p4.exCount ? Math.round(data.p4.students.reduce((a,x)=>a+x.exSubmitted,0)/data.p4.students.length/data.p4.exCount*100) : 0}%;background:var(--red)"></div></div>
            <span class="compare-pct">${data.p4.exCount ? Math.round(data.p4.students.reduce((a,x)=>a+x.exSubmitted,0)/data.p4.students.length/data.p4.exCount*100) : 0}%</span>
          </div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">สัดส่วนการส่ง</div>
        <div style="position:relative;height:180px">
          <canvas id="chart-overview-donut" role="img" aria-label="กราฟวงกลมแสดงสัดส่วนการส่งงาน">ป.4 ส่ง ${s4.totalSubmitted} ขาด ${s4.totalSlots-s4.totalSubmitted} | ป.6 ส่ง ${s6.totalSubmitted} ขาด ${s6.totalSlots-s6.totalSubmitted}</canvas>
        </div>
        <div style="display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12px;color:var(--text3)">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--blue);display:inline-block"></span>ป.4 ส่ง</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:var(--green);display:inline-block"></span>ป.6 ส่ง</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,0.1);display:inline-block"></span>ขาด</span>
        </div>
      </div>
    </div>

    <div class="section-title">นักเรียนที่ต้องติดตามงาน (ทุกห้อง)</div>
    ${renderTopMissingTable([...data.p4.students.map(s=>({...s,class:'ป.4'})), ...data.p6.students.map(s=>({...s,class:'ป.6'}))]
      .filter(s => s.missing > 0)
      .sort((a,b) => b.missing - a.missing)
      .slice(0, 10), 'overview')}
  `;

  document.getElementById('overview-content').innerHTML = html;

  // donut chart
  if (charts['overview-donut']) charts['overview-donut'].destroy();
  charts['overview-donut'] = new Chart(document.getElementById('chart-overview-donut'), {
    type: 'doughnut',
    data: {
      labels: ['ป.4 ส่ง', 'ป.6 ส่ง', 'ขาด'],
      datasets: [{
        data: [s4.totalSubmitted, s6.totalSubmitted, (s4.totalSlots - s4.totalSubmitted) + (s6.totalSlots - s6.totalSubmitted)],
        backgroundColor: ['#4f8ef7', '#34c78a', 'rgba(255,255,255,0.07)'],
        borderWidth: 0,
        hoverOffset: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '68%',
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}` }
      }}
    }
  });
}

function renderTopMissingTable(students, prefix) {
  if (!students.length) return '<div class="empty-state">ไม่มีนักเรียนค้างงาน 🎉</div>';
  return `<table class="student-table">
    <thead><tr>
      <th>ชื่อ</th>
      ${prefix === 'overview' ? '<th>ห้อง</th>' : ''}
      <th>ส่งแล้ว</th>
      <th style="min-width:100px">ความคืบหน้า</th>
      <th>ขาดส่ง</th>
    </tr></thead>
    <tbody>
    ${students.map(s => {
      const pct = s.total ? Math.round(s.submitted / s.total * 100) : 0;
      const cls = s.class || '';
      const badgeCls = s.missing === 0 ? 'badge-green' : s.missing <= 3 ? 'badge-amber' : 'badge-red';
      return `<tr onclick="openModal('${s.fullName.replace(/'/g,"\\'")}','${cls}')">
        <td style="font-weight:500">${s.name}</td>
        ${prefix === 'overview' ? `<td><span class="badge badge-amber">${cls}</span></td>` : ''}
        <td style="color:var(--text2);font-family:'IBM Plex Mono',monospace;font-size:13px">${s.submitted}/${s.total}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="progress-bar" style="width:80px">
              <div class="progress-fill" style="width:${pct}%;background:${pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}"></div>
            </div>
            <span style="font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace">${pct}%</span>
          </div>
        </td>
        <td><span class="badge ${badgeCls}">${s.missing} ชิ้น</span></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

function renderClass(key, d, label) {
  if (!d) return;
  const s = calcStats(d);
  const contentId = `${key}-content`;

  const htmlStats = `
    <div class="stats">
      <div class="stat-card blue">
        <div class="stat-label">นักเรียน</div>
        <div class="stat-value">${s.count}</div>
        <div class="stat-sub">คน</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">อัตราส่งงาน</div>
        <div class="stat-value">${s.rate}%</div>
        <div class="stat-sub">${s.totalSubmitted}/${s.totalSlots} ชิ้น</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">งานทั้งหมด</div>
        <div class="stat-value">${s.total}</div>
        <div class="stat-sub">หนังสือ ${d.nbCount} + ฝึกหัด ${d.exCount}</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">มีงานค้าง</div>
        <div class="stat-value">${s.hasMissing}</div>
        <div class="stat-sub">จาก ${s.count} คน</div>
      </div>
    </div>`;

  const htmlChart = `
    <div class="grid2">
      <div class="chart-card">
        <div class="chart-title">จำนวนงานที่ส่ง — รายคน</div>
        <div style="position:relative;height:${Math.max(240, d.students.length * 26 + 60)}px">
          <canvas id="chart-${key}-hbar" role="img" aria-label="กราฟแท่งนอนแสดงจำนวนงานที่ส่งรายคน"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-title">หนังสือ vs แบบฝึกหัด</div>
        <div style="position:relative;height:200px">
          <canvas id="chart-${key}-compare" role="img" aria-label="กราฟเปรียบเทียบการส่งหนังสือและแบบฝึกหัด"></canvas>
        </div>
      </div>
    </div>`;

  const filterBtns = `
    <div class="filter-row">
      <button class="filter-btn ${currentFilter[key]==='all'?'active':''}" onclick="setFilter('${key}','all')">ทั้งหมด (${d.students.length})</button>
      <button class="filter-btn ${currentFilter[key]==='missing'?'active':''}" onclick="setFilter('${key}','missing')">มีงานค้าง (${s.hasMissing})</button>
      <button class="filter-btn ${currentFilter[key]==='ok'?'active':''}" onclick="setFilter('${key}','ok')">ส่งครบ (${s.fullySubmitted})</button>
    </div>`;

  const filtered = currentFilter[key] === 'missing'
    ? d.students.filter(x => x.missing > 0)
    : currentFilter[key] === 'ok'
    ? d.students.filter(x => x.missing === 0)
    : d.students;

  const htmlTable = `
    <div class="section-title">รายชื่อนักเรียน <span style="font-weight:400;text-transform:none;color:var(--text3);font-size:12px">(คลิกเพื่อดูรายละเอียด)</span></div>
    ${filterBtns}
    ${renderTopMissingTable(filtered.map(s=>({...s,class:label})), key)}`;

  document.getElementById(contentId).innerHTML = htmlStats + htmlChart + htmlTable;

  // Horizontal bar chart
  const sortedBySubmit = [...d.students].sort((a,b) => b.submitted - a.submitted);
  if (charts[`${key}-hbar`]) charts[`${key}-hbar`].destroy();
  charts[`${key}-hbar`] = new Chart(document.getElementById(`chart-${key}-hbar`), {
    type: 'bar',
    data: {
      labels: sortedBySubmit.map(s => s.name),
      datasets: [
        { label: 'ส่งแล้ว', data: sortedBySubmit.map(s => s.submitted), backgroundColor: '#4f8ef7', borderRadius: 3, stack: 'a' },
        { label: 'ขาดส่ง', data: sortedBySubmit.map(s => s.missing), backgroundColor: 'rgba(255,255,255,0.05)', borderRadius: 3, stack: 'a' },
      ]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, max: s.total, ticks: { color: '#555a72', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { stacked: true, ticks: { color: '#8b90a7', font: { size: 11, family: 'Sarabun' } }, grid: { display: false } }
      }
    }
  });

  // Compare nb vs ex
  if (charts[`${key}-compare`]) charts[`${key}-compare`].destroy();
  charts[`${key}-compare`] = new Chart(document.getElementById(`chart-${key}-compare`), {
    type: 'bar',
    data: {
      labels: ['หนังสือ', 'แบบฝึกหัด'],
      datasets: [
        { label: 'ส่งแล้ว', data: [
          d.students.reduce((a,x)=>a+x.nbSubmitted,0),
          d.students.reduce((a,x)=>a+x.exSubmitted,0)
        ], backgroundColor: '#34c78a', borderRadius: 4 },
        { label: 'ขาดส่ง', data: [
          d.students.reduce((a,x)=>a+x.nbMissing,0),
          d.students.reduce((a,x)=>a+x.exMissing,0)
        ], backgroundColor: '#f25c7a', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { color: '#555a72' }, grid: { color: 'rgba(255,255,255,0.04)' } },
        x: { ticks: { color: '#8b90a7' }, grid: { display: false } }
      }
    }
  });
}

function setFilter(key, filter) {
  currentFilter[key] = filter;
  renderClass(key, data[key], key === 'p4' ? 'ป.4' : 'ป.6');
}

// ── MODAL ──────────────────────────────────────────────────
function openModal(fullName, cls) {
  const d = cls === 'ป.4' ? data.p4 : data.p6;
  const student = d.students.find(s => s.fullName === fullName);
  if (!student) return;

  document.getElementById('modal-name').textContent = student.fullName;
  document.getElementById('modal-meta').textContent = `${cls} · เลขที่ ${student.num} · ${student.submitted}/${student.total} ชิ้น`;

  const pct = student.total ? Math.round(student.submitted / student.total * 100) : 0;

  const nbMissing = student.missingList.filter(x => x.type === 'nb');
  const exMissing = student.missingList.filter(x => x.type === 'ex');

  const body = `
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-val" style="color:var(--green)">${student.submitted}</div>
        <div class="modal-stat-label">ส่งแล้ว</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val" style="color:var(--red)">${student.missing}</div>
        <div class="modal-stat-label">ขาดส่ง</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-val" style="color:${pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}">${pct}%</div>
        <div class="modal-stat-label">ความคืบหน้า</div>
      </div>
    </div>

    <div style="margin-bottom:20px">
      <div class="progress-bar" style="height:8px">
        <div class="progress-fill" style="width:${pct}%;background:${pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}"></div>
      </div>
    </div>

    ${student.missing === 0 ? `
      <div style="text-align:center;padding:24px;color:var(--green);font-size:15px">
        ✓ ส่งงานครบทุกชิ้น
      </div>
    ` : `
      ${nbMissing.length ? `
        <div class="missing-section">
          <div class="missing-title"><span class="missing-dot amber"></span>หนังสือที่ยังไม่ส่ง (${nbMissing.length} ครั้ง)</div>
          <div class="missing-list">
            ${nbMissing.map(x => `<div class="missing-item nb">${x.name}</div>`).join('')}
          </div>
        </div>` : ''}
      ${exMissing.length ? `
        <div class="missing-section">
          <div class="missing-title"><span class="missing-dot red"></span>แบบฝึกหัดที่ยังไม่ส่ง (${exMissing.length} ครั้ง)</div>
          <div class="missing-list">
            ${exMissing.map(x => `<div class="missing-item ex">${x.name}</div>`).join('')}
          </div>
        </div>` : ''}
    `}
  `;

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('open');
  }
}

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['overview','p4','p6'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === `panel-${tab}`);
  });
}

// ── INIT ──────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
