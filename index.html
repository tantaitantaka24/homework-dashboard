<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard การส่งงาน — คณิตศาสตร์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#F5F6FA;color:#1a1d2e;font-size:16px;line-height:1.6;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #E5E7EF;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:10px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,0.15);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.header-title{font-size:16px;font-weight:600;color:#1a1d2e}
.header-right{display:flex;align-items:center;gap:10px}
.last-update{font-size:13px;color:#8B90A7;font-family:'IBM Plex Mono',monospace}
.btn-refresh{background:#fff;border:1.5px solid #E5E7EF;color:#555;padding:7px 16px;border-radius:8px;font-size:14px;font-family:'Sarabun',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;font-weight:500}
.btn-refresh:hover{border-color:#378ADD;color:#378ADD;background:#F0F7FF}
.tabs-bar{background:#fff;border-bottom:1px solid #E5E7EF;padding:0 20px;display:flex;gap:0}
.tab{padding:14px 22px;font-size:15px;font-weight:500;cursor:pointer;border-bottom:2.5px solid transparent;color:#8B90A7;transition:all .15s;font-family:'Sarabun',sans-serif;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#378ADD;border-bottom-color:#378ADD}
.tab:hover:not(.active){color:#555}
.main{padding:20px;max-width:1100px;margin:0 auto}
.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #E5E7EF;border-radius:12px;padding:18px 20px;border-top:3px solid transparent;transition:box-shadow .15s}
.stat-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.stat-card.blue{border-top-color:#378ADD}
.stat-card.green{border-top-color:#1D9E75}
.stat-card.red{border-top-color:#E24B4A}
.stat-card.amber{border-top-color:#F5A623}
.stat-label{font-size:15px;color:#8B90A7;margin-bottom:6px;font-weight:500}
.stat-value{font-size:28px;font-weight:600;line-height:1.1}
.stat-card.blue .stat-value{color:#378ADD}
.stat-card.green .stat-value{color:#1D9E75}
.stat-card.red .stat-value{color:#E24B4A}
.stat-card.amber .stat-value{color:#F5A623}
.stat-sub{font-size:13px;color:#B0B5C8;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #E5E7EF;border-radius:12px;padding:18px 20px}
.card-title{font-size:12px;font-weight:600;color:#8B90A7;text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
.compare-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.compare-label{width:36px;font-size:14px;color:#555;font-weight:600}
.compare-bar-wrap{flex:1;background:#F0F1F5;border-radius:5px;height:10px;overflow:hidden}
.compare-bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
.compare-pct{width:38px;text-align:right;font-size:13px;color:#555;font-family:'IBM Plex Mono',monospace}
.search-wrap{position:relative;margin-bottom:12px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#B0B5C8;font-size:16px}
.search-input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid #E5E7EF;border-radius:10px;font-size:15px;font-family:'Sarabun',sans-serif;color:#1a1d2e;background:#fff;outline:none;transition:border .15s}
.search-input:focus{border-color:#378ADD}
.search-input::placeholder{color:#B0B5C8}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:20px;font-size:14px;font-family:'Sarabun',sans-serif;border:1.5px solid #E5E7EF;background:#fff;color:#8B90A7;cursor:pointer;transition:all .15s;font-weight:500}
.filter-btn.active{background:#EBF4FF;color:#378ADD;border-color:#378ADD}
.filter-btn:hover:not(.active){border-color:#C0C5D8;color:#555}
.section-title{font-size:13px;font-weight:600;color:#8B90A7;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px}
.student-list{display:flex;flex-direction:column;gap:8px}
.student-row{background:#fff;border:1px solid #E5E7EF;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.student-row:hover{border-color:#378ADD;box-shadow:0 2px 10px rgba(55,138,221,0.1)}
.student-badge{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.badge-green{background:#E8F8F2;color:#1D9E75}
.badge-amber{background:#FEF6E4;color:#D4900A}
.badge-red{background:#FEF0EF;color:#E24B4A}
.student-name{font-size:16px;font-weight:600;color:#1a1d2e;flex:1;min-width:0}
.student-class{font-size:13px;color:#8B90A7;margin-top:1px}
.student-stats{display:flex;align-items:center;gap:10px;flex-shrink:0}
.progress-mini{width:70px}
.progress-track{background:#F0F1F5;border-radius:4px;height:6px;overflow:hidden;margin-bottom:3px}
.progress-fill{height:100%;border-radius:4px}
.pct-label{font-size:12px;color:#B0B5C8;text-align:right;font-family:'IBM Plex Mono',monospace}
.missing-badge{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.missing-many{background:#FEF0EF;color:#E24B4A}
.missing-some{background:#FEF6E4;color:#D4900A}
.missing-few{background:#E8F8F2;color:#1D9E75}
.arrow-btn{color:#C0C5D8;font-size:18px;font-weight:300}
.overlay{display:none;position:fixed;inset:0;background:rgba(30,35,60,0.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
.modal-header{padding:20px 22px 16px;border-bottom:1px solid #E5E7EF;display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-radius:16px 16px 0 0}
.modal-name{font-size:20px;font-weight:700;margin-bottom:3px;color:#1a1d2e}
.modal-meta{font-size:14px;color:#8B90A7}
.modal-close{background:#F5F6FA;border:1px solid #E5E7EF;color:#8B90A7;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.modal-close:hover{color:#1a1d2e;border-color:#C0C5D8}
.modal-body{padding:20px 22px}
.modal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.modal-stat{background:#F8F9FC;border-radius:10px;padding:12px 14px;text-align:center}
.modal-stat-val{font-size:22px;font-weight:700}
.modal-stat-label{font-size:13px;color:#8B90A7;margin-top:2px}
.modal-progress{background:#F0F1F5;border-radius:6px;height:10px;overflow:hidden;margin-bottom:20px}
.modal-progress-fill{height:100%;border-radius:6px;transition:width .5s ease}
.missing-section{margin-bottom:18px}
.missing-section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8B90A7;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.missing-dot{width:7px;height:7px;border-radius:50%}
.missing-items{display:flex;flex-direction:column;gap:5px}
.missing-item{background:#F8F9FC;border-radius:8px;padding:10px 14px;font-size:14px;color:#555;border-left:3px solid transparent}
.missing-item.nb{border-left-color:#F5A623}
.missing-item.ex{border-left-color:#E24B4A}
.all-done{text-align:center;padding:28px;color:#1D9E75;font-size:16px;font-weight:500}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px;color:#8B90A7;font-size:15px}
.spinner{width:22px;height:22px;border:2.5px solid #E5E7EF;border-top-color:#378ADD;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:#FEF0EF;border:1.5px solid #F9C8C7;border-radius:10px;padding:16px 18px;color:#C0392B;font-size:15px;margin-bottom:16px;line-height:1.7}
.empty-state{text-align:center;padding:40px;color:#B0B5C8;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="live-dot"></div>
    <span class="header-title">Dashboard การส่งงาน — คณิตศาสตร์</span>
  </div>
  <div class="header-right">
    <span class="last-update" id="lastUpdate">กำลังโหลด...</span>
    <button class="btn-refresh" onclick="loadData()">↺ รีเฟรช</button>
  </div>
</div>

<div class="tabs-bar">
  <button class="tab active" onclick="switchTab('overview')">ภาพรวม</button>
  <button class="tab" onclick="switchTab('p4')">ป.4</button>
  <button class="tab" onclick="switchTab('p6')">ป.6</button>
</div>

<div class="main">
  <div class="panel active" id="panel-overview">
    <div id="overview-content"><div class="loading"><div class="spinner"></div>กำลังดึงข้อมูลจาก Google Sheets...</div></div>
  </div>
  <div class="panel" id="panel-p4">
    <div id="p4-content"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
  </div>
  <div class="panel" id="panel-p6">
    <div id="p6-content"><div class="loading"><div class="spinner"></div>กำลังโหลด...</div></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SHEET_ID = '1B_10xc1K2HYEHACRxxc9OoKoW5kmfQe0aMYKBES15Q8';
const GID_P4 = '21024681';
const GID_P6 = '1784260155';
let data = {p4:null, p6:null};
let charts = {};
let currentFilter = {p4:'all', p6:'all'};
let searchQuery = {p4:'', p6:''};

async function fetchCSV(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}

function parseCSV(text) {
  return text.split('\n').map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim()); return cols;
  });
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = 'กำลังโหลด...';
  ['overview','p4','p6'].forEach(k => {
    const el = document.getElementById(`${k}-content`);
    if (el) el.innerHTML = '<div class="loading"><div class="spinner"></div>กำลังดึงข้อมูล...</div>';
  });
  try {
    const [r4, r6] = await Promise.all([fetchCSV(GID_P4), fetchCSV(GID_P6)]);
    data.p4 = parseSheet(r4);
    data.p6 = parseSheet(r6);
    const now = new Date();
    document.getElementById('lastUpdate').textContent =
      `อัปเดต ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} น.`;
    renderAll();
  } catch(e) {
    document.getElementById('overview-content').innerHTML =
      `<div class="error-msg">⚠ ดึงข้อมูลไม่ได้: ${e.message}<br><small style="font-size:13px">ตรวจสอบว่า Sheet แชร์เป็น "Anyone with the link can view" แล้ว</small></div>`;
    document.getElementById('lastUpdate').textContent = 'โหลดไม่สำเร็จ';
  }
}

function parseSheet(rows) {
  if (rows.length < 4) return {students:[], nbCount:0, exCount:0};
  const hdr = rows[1] || [];
  const taskRow = rows[2] || [];
  // หา range ของ column จาก header row 2 (น1..นN, ฝ1..ฝN)
  let nbStart=-1, nbEnd=-1, exStart=-1, exEnd=-1;
  for (let i=0; i<hdr.length; i++) {
    if (hdr[i].startsWith('น') && nbStart===-1) nbStart=i;
    if (hdr[i].startsWith('น')) nbEnd=i;
    if (hdr[i].startsWith('ฝ') && exStart===-1) exStart=i;
    if (hdr[i].startsWith('ฝ')) exEnd=i;
  }
  // นับเฉพาะ column ที่มีชื่องานจริงใน row 3 (ไม่ว่าง)
  const taskNames = [];
  const activeNbCols = [];
  const activeExCols = [];
  for (let i=nbStart; i<=nbEnd; i++) {
    const t = (taskRow[i]||'').trim();
    if (t) { taskNames.push(t); activeNbCols.push(i); }
  }
  for (let i=exStart; i<=exEnd; i++) {
    const t = (taskRow[i]||'').trim();
    if (t) { taskNames.push(t); activeExCols.push(i); }
  }
  const nbCount = activeNbCols.length;
  const exCount = activeExCols.length;
  const students = [];
  for (let r=3; r<rows.length; r++) {
    const row = rows[r];
    if (!row[0] || !row[1]) continue;
    const fullName = row[1].trim();
    const name = fullName.replace(/^ด\.[ชญ]\./, '').trim();
    const submitted=[], missing=[];
    activeNbCols.forEach((col,idx) => {
      const tname = taskNames[idx];
      if ((row[col]||'').trim()==='ส่ง') submitted.push({name:tname,type:'nb'});
      else missing.push({name:tname,type:'nb'});
    });
    activeExCols.forEach((col,idx) => {
      const tname = taskNames[activeNbCols.length+idx];
      if ((row[col]||'').trim()==='ส่ง') submitted.push({name:tname,type:'ex'});
      else missing.push({name:tname,type:'ex'});
    });
    students.push({
      num: parseInt(row[0])||r-2, name, fullName,
      submitted: submitted.length, missing: missing.length,
      total: nbCount+exCount,
      missingList: missing, submittedList: submitted,
      nbSubmitted: submitted.filter(x=>x.type==='nb').length,
      exSubmitted: submitted.filter(x=>x.type==='ex').length,
      nbMissing: missing.filter(x=>x.type==='nb').length,
      exMissing: missing.filter(x=>x.type==='ex').length,
    });
  }
  return {students, nbCount, exCount};
}

function calcStats(d) {
  if (!d||!d.students.length) return null;
  const s=d.students, total=d.nbCount+d.exCount;
  const totalSlots=s.length*total;
  const totalSubmitted=s.reduce((a,x)=>a+x.submitted,0);
  const rate=totalSlots?Math.round(totalSubmitted/totalSlots*100):0;
  return {total, totalSlots, totalSubmitted, rate,
    fullySubmitted:s.filter(x=>x.missing===0).length,
    hasMissing:s.filter(x=>x.missing>0).length,
    count:s.length};
}

function studentBadge(s) {
  const pct = s.total ? Math.round(s.submitted/s.total*100) : 0;
  const isBoy = s.fullName.startsWith('ด.ช.');
  const emoji = isBoy ? '👦' : '👧';
  if (pct>=80) return {cls:'badge-green', label: emoji};
  if (pct>=40) return {cls:'badge-amber', label: emoji};
  return {cls:'badge-red', label: emoji};
}

function missingBadgeClass(missing) {
  if (missing===0) return 'missing-few';
  if (missing<=10) return 'missing-some';
  return 'missing-many';
}

function progressColor(pct) {
  if (pct>=80) return '#1D9E75';
  if (pct>=40) return '#F5A623';
  return '#E24B4A';
}

function renderStudentRow(s, showClass) {
  const pct = s.total ? Math.round(s.submitted/s.total*100) : 0;
  const b = studentBadge(s);
  const cls = s.class||'';
  return `<div class="student-row" onclick="openModal('${s.fullName.replace(/'/g,"\\'")}','${cls}')">
    <div class="student-badge ${b.cls}">${b.label}</div>
    <div style="flex:1;min-width:0">
      <div class="student-name">${s.name}</div>
      ${showClass ? `<div class="student-class">${cls}</div>` : ''}
    </div>
    <div class="student-stats">
      <div class="progress-mini">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${progressColor(pct)}"></div></div>
        <div class="pct-label">${pct}%</div>
      </div>
      <span style="font-size:14px;color:#8B90A7;font-family:'IBM Plex Mono',monospace;min-width:52px;text-align:right">${s.submitted}/${s.total}</span>
      <span class="missing-badge ${missingBadgeClass(s.missing)}">${s.missing===0?'ครบ':s.missing+' ชิ้น'}</span>
      <span class="arrow-btn">›</span>
    </div>
  </div>`;
}

function renderAll() {
  renderOverview();
  renderClass('p4', data.p4, 'ป.4');
  renderClass('p6', data.p6, 'ป.6');
}

function renderOverview() {
  const s4=calcStats(data.p4), s6=calcStats(data.p6);
  if (!s4||!s6) return;
  const avg = Math.round((s4.rate+s6.rate)/2);
  const html = `
    <div class="stats">
      <div class="stat-card blue"><div class="stat-label">👨‍🎓 นักเรียนทั้งหมด</div><div class="stat-value">${s4.count+s6.count}</div><div class="stat-sub">ป.4: ${s4.count} / ป.6: ${s6.count}</div></div>
      <div class="stat-card green"><div class="stat-label">📊 อัตราส่งงานเฉลี่ย</div><div class="stat-value">${avg}%</div><div class="stat-sub">ป.4: ${s4.rate}% / ป.6: ${s6.rate}%</div></div>
      <div class="stat-card red"><div class="stat-label">⚠️ มีงานค้าง</div><div class="stat-value">${s4.hasMissing+s6.hasMissing}</div><div class="stat-sub">คน</div></div>
      <div class="stat-card amber"><div class="stat-label">✅ ส่งครบทุกชิ้น</div><div class="stat-value">${s4.fullySubmitted+s6.fullySubmitted}</div><div class="stat-sub">คน</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">อัตราส่งงาน — เปรียบเทียบ</div>
        <div class="compare-row"><span class="compare-label">ป.4</span><div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${s4.rate}%;background:#378ADD"></div></div><span class="compare-pct">${s4.rate}%</span></div>
        <div class="compare-row"><span class="compare-label">ป.6</span><div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${s6.rate}%;background:#1D9E75"></div></div><span class="compare-pct">${s6.rate}%</span></div>
        <div style="margin-top:18px;padding-top:14px;border-top:1px solid #F0F1F5">
          <div class="compare-row">
            <span class="compare-label" style="width:80px;font-size:13px">หนังสือ ป.4</span>
            <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${data.p4.nbCount?Math.round(data.p4.students.reduce((a,x)=>a+x.nbSubmitted,0)/data.p4.students.length/data.p4.nbCount*100):0}%;background:#F5A623"></div></div>
            <span class="compare-pct">${data.p4.nbCount?Math.round(data.p4.students.reduce((a,x)=>a+x.nbSubmitted,0)/data.p4.students.length/data.p4.nbCount*100):0}%</span>
          </div>
          <div class="compare-row">
            <span class="compare-label" style="width:80px;font-size:13px">ฝึกหัด ป.4</span>
            <div class="compare-bar-wrap"><div class="compare-bar-fill" style="width:${data.p4.exCount?Math.round(data.p4.students.reduce((a,x)=>a+x.exSubmitted,0)/data.p4.students.length/data.p4.exCount*100):0}%;background:#E24B4A"></div></div>
            <span class="compare-pct">${data.p4.exCount?Math.round(data.p4.students.reduce((a,x)=>a+x.exSubmitted,0)/data.p4.students.length/data.p4.exCount*100):0}%</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">สัดส่วนการส่ง (รวม 2 ห้อง)</div>
        <div style="position:relative;height:190px"><canvas id="chart-overview-donut" role="img" aria-label="กราฟวงกลมสัดส่วนการส่งงาน"></canvas></div>
        <div style="display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:13px;color:#8B90A7;flex-wrap:wrap">
          <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#378ADD;display:inline-block"></span>ป.4 ส่ง</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75;display:inline-block"></span>ป.6 ส่ง</span>
          <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#E5E7EF;display:inline-block"></span>ขาด</span>
        </div>
      </div>
    </div>`;
  document.getElementById('overview-content').innerHTML = html;
  if (charts['overview-donut']) charts['overview-donut'].destroy();
  charts['overview-donut'] = new Chart(document.getElementById('chart-overview-donut'),{
    type:'doughnut',
    data:{labels:['ป.4 ส่ง','ป.6 ส่ง','ขาด'],datasets:[{data:[s4.totalSubmitted,s6.totalSubmitted,(s4.totalSlots-s4.totalSubmitted)+(s6.totalSlots-s6.totalSubmitted)],backgroundColor:['#378ADD','#1D9E75','#E5E7EF'],borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}
  });
}

function renderClass(key, d, label) {
  if (!d) return;
  const s = calcStats(d);
  const nb4pct = d.nbCount?Math.round(d.students.reduce((a,x)=>a+x.nbSubmitted,0)/d.students.length/d.nbCount*100):0;
  const ex4pct = d.exCount?Math.round(d.students.reduce((a,x)=>a+x.exSubmitted,0)/d.students.length/d.exCount*100):0;
  const statsHtml = `
    <div class="stats">
      <div class="stat-card blue"><div class="stat-label">👨‍🎓 นักเรียน</div><div class="stat-value">${s.count}</div><div class="stat-sub">คน</div></div>
      <div class="stat-card green"><div class="stat-label">📊 อัตราส่งงาน</div><div class="stat-value">${s.rate}%</div></div>
      <div class="stat-card amber"><div class="stat-label">📚 งานทั้งหมด</div><div class="stat-value">${s.total}</div><div class="stat-sub">หนังสือ ${d.nbCount} + ฝึกหัด ${d.exCount}</div></div>
      <div class="stat-card red"><div class="stat-label">⚠️ มีงานค้าง</div><div class="stat-value">${s.hasMissing}</div><div class="stat-sub">จาก ${s.count} คน</div></div>
    </div>`;
  const chartHtml = `
    <div class="card" style="margin-bottom:20px">
      <div class="card-title">หนังสือ vs แบบฝึกหัด — สรุปทั้งห้อง</div>
      <div style="display:flex;gap:14px;margin-bottom:10px;font-size:13px;color:#8B90A7">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75;display:inline-block"></span>ส่งแล้ว</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#E24B4A;display:inline-block"></span>ขาดส่ง</span>
      </div>
      <div style="position:relative;height:200px"><canvas id="chart-${key}-compare" role="img" aria-label="กราฟเปรียบเทียบหนังสือและแบบฝึกหัด"></canvas></div>
    </div>`;
  const tableHtml = `
    <div class="section-title">รายชื่อนักเรียน <span style="font-weight:400;text-transform:none;font-size:13px;color:#B0B5C8">(แตะชื่อเพื่อดูรายละเอียด)</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" placeholder="ค้นหาชื่อนักเรียน..." oninput="onSearch('${key}',this.value)" value="${searchQuery[key]||''}">
    </div>
    <div class="filter-row">
      <button class="filter-btn ${currentFilter[key]==='all'?'active':''}" onclick="setFilter('${key}','all')">ทั้งหมด (${s.count})</button>
      <button class="filter-btn ${currentFilter[key]==='missing'?'active':''}" onclick="setFilter('${key}','missing')">มีงานค้าง (${s.hasMissing})</button>
      <button class="filter-btn ${currentFilter[key]==='ok'?'active':''}" onclick="setFilter('${key}','ok')">ส่งครบ (${s.fullySubmitted})</button>
    </div>
    <div class="student-list" id="list-${key}">
      ${buildStudentList(key, d, label)}
    </div>`;
  document.getElementById(`${key}-content`).innerHTML = statsHtml + chartHtml + tableHtml;
  if (charts[`${key}-compare`]) charts[`${key}-compare`].destroy();
  charts[`${key}-compare`] = new Chart(document.getElementById(`chart-${key}-compare`),{
    type:'bar',
    data:{
      labels:['หนังสือ','แบบฝึกหัด'],
      datasets:[
        {label:'ส่งแล้ว',data:[d.students.reduce((a,x)=>a+x.nbSubmitted,0),d.students.reduce((a,x)=>a+x.exSubmitted,0)],backgroundColor:'#1D9E75',borderRadius:5},
        {label:'ขาดส่ง',data:[d.students.reduce((a,x)=>a+x.nbMissing,0),d.students.reduce((a,x)=>a+x.exMissing,0)],backgroundColor:'#E24B4A',borderRadius:5}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{color:'#8B90A7'},grid:{color:'rgba(0,0,0,0.05)'}},x:{ticks:{color:'#555',font:{size:14,family:'Sarabun'}},grid:{display:false}}}}
  });
}

function buildStudentList(key, d, label) {
  if (!d) return '';
  const q = (searchQuery[key]||'').toLowerCase();
  let list = d.students.map(s=>({...s, class:label}));
  if (currentFilter[key]==='missing') list = list.filter(s=>s.missing>0);
  if (currentFilter[key]==='ok') list = list.filter(s=>s.missing===0);
  if (q) list = list.filter(s=>s.name.toLowerCase().includes(q)||s.fullName.toLowerCase().includes(q));
  if (!list.length) return '<div class="empty-state">ไม่พบนักเรียน</div>';
  return list.map(s=>renderStudentRow(s, false)).join('');
}

function onSearch(key, val) {
  searchQuery[key] = val;
  const d = data[key];
  const label = key==='p4'?'ป.4':'ป.6';
  const el = document.getElementById(`list-${key}`);
  if (el) el.innerHTML = buildStudentList(key, d, label);
}

function setFilter(key, filter) {
  currentFilter[key] = filter;
  renderClass(key, data[key], key==='p4'?'ป.4':'ป.6');
}

function openModal(fullName, cls) {
  const d = cls==='ป.4'?data.p4:data.p6;
  const student = d.students.find(s=>s.fullName===fullName);
  if (!student) return;
  const pct = student.total?Math.round(student.submitted/student.total*100):0;
  const nbMissing = student.missingList.filter(x=>x.type==='nb');
  const exMissing = student.missingList.filter(x=>x.type==='ex');
  document.getElementById('modal-name').textContent = student.fullName;
  document.getElementById('modal-meta').textContent = `${cls} · เลขที่ ${student.num} · ส่งแล้ว ${student.submitted} จาก ${student.total} ชิ้น`;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-val" style="color:#1D9E75">${student.submitted}</div><div class="modal-stat-label">ส่งแล้ว</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:#E24B4A">${student.missing}</div><div class="modal-stat-label">ขาดส่ง</div></div>
      <div class="modal-stat"><div class="modal-stat-val" style="color:${progressColor(pct)}">${pct}%</div><div class="modal-stat-label">ความคืบหน้า</div></div>
    </div>
    <div class="modal-progress" style="margin-bottom:20px"><div class="modal-progress-fill" style="width:${pct}%;background:${progressColor(pct)}"></div></div>
    ${student.missing===0
      ? '<div class="all-done">✓ ส่งงานครบทุกชิ้น</div>'
      : `${nbMissing.length?`
        <div class="missing-section">
          <div class="missing-section-title"><span class="missing-dot" style="background:#F5A623"></span>หนังสือที่ยังไม่ส่ง (${nbMissing.length} ครั้ง)</div>
          <div class="missing-items">${nbMissing.map(x=>`<div class="missing-item nb">${x.name}</div>`).join('')}</div>
        </div>` : ''}
        ${exMissing.length?`
        <div class="missing-section">
          <div class="missing-section-title"><span class="missing-dot" style="background:#E24B4A"></span>แบบฝึกหัดที่ยังไม่ส่ง (${exMissing.length} ครั้ง)</div>
          <div class="missing-items">${exMissing.map(x=>`<div class="missing-item ex">${x.name}</div>`).join('')}</div>
        </div>` : ''}`}`;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(e) {
  if (!e||e.target===document.getElementById('overlay')) {
    document.getElementById('overlay').classList.remove('open');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['overview','p4','p6'][i]===tab);
  });
  document.querySelectorAll('.panel').forEach(p=>{
    p.classList.toggle('active',p.id===`panel-${tab}`);
  });
}

loadData();
</script>
</body>
</html>
